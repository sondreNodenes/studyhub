<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyHub</title>
<meta name="description" content="Notes, flashcards and exam-style quizzes for every course - extendable with your own lecture notes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6fed'/%3E%3Cpath d='M26 34h48v8H26zm0 16h48v8H26zm0 16h30v8H26z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#f0f2f8; --text:#1a1f2b; --muted:#667085; --border:#e3e7ef;
  --accent:#2f6fed; --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --good:#16a34a; --good-soft:rgba(22,163,74,.12); --bad:#dc2626; --bad-soft:rgba(220,38,38,.1); --warn:#d97706;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --radius:14px; --sidebar:292px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161b24; --surface2:#1d2330; --text:#e7eaf1; --muted:#98a2b3; --border:#273042;
  --good-soft:rgba(34,197,94,.16); --bad-soft:rgba(248,113,113,.16); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b24; --surface2:#1d2330; --text:#e7eaf1; --muted:#98a2b3; --border:#273042;
    --good-soft:rgba(34,197,94,.16); --bad-soft:rgba(248,113,113,.16); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;left:-9999px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px 24px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;padding:6px 8px 14px;color:var(--text)}
.brand:hover{text-decoration:none}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px}
.nav-sec{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--text);font-size:.95rem}
.nav-link:hover{background:var(--surface2);text-decoration:none}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.course-link{--c:var(--accent)}
.course-link .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.course-link .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.course-link .pct{font-size:.75rem;color:var(--muted)}
.lec-list{margin:2px 0 8px 18px;border-left:2px solid var(--border);padding-left: 6px}
.lec-link{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;font-size:.86rem;color:var(--muted)}
.lec-link:hover{background:var(--surface2);text-decoration:none;color:var(--text)}
.lec-link.active{color:var(--text);background:var(--surface2);font-weight:600}
.batch-pick{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.batch-pick select{padding:4px 6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.doc-title{flex:1;min-width:200px;font:inherit;font-size:1.35rem;font-weight:700;border:1px solid transparent;background:transparent;color:var(--text);padding:4px 8px;border-radius:8px}
.doc-title:hover,.doc-title:focus{border-color:var(--border);background:var(--surface)}
.doc-wrap{max-width:980px;margin:0 auto}
.doc-wrap .tox-tinymce{border-radius:12px}
.tex-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.tex-src .CodeMirror{height:calc(100vh - 210px);min-height:420px;border:1px solid var(--border);border-radius:12px;font-size:13.5px}
.tex-pdf .pdfframe,.tex-pdf .pdfjs{height:calc(100vh - 210px)}
.tex-err{margin:4px 0}
@media (max-width:1100px){.tex-split{grid-template-columns:1fr}.tex-src .CodeMirror{height:60vh}}
.ed-overlay{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.ed-card{width:min(980px,96vw);max-height:94vh;display:flex;flex-direction:column}
.ed-scroll{overflow:auto;flex:1;min-height:0}
.mastery-pill{font:inherit;color:var(--accent);background:var(--accent-soft);border:none;border-radius:99px;padding:1px 9px;cursor:pointer}
.mastery-pill:hover{filter:brightness(.97)}
.mastery-card{margin:12px 0 16px;border-left:4px solid var(--good)}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.m-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--border);margin:6px 0 4px}
.m-bar i{display:block;height:100%}.m-bar i.ok{background:var(--good)}.m-bar i.mid{background:var(--warn)}.m-bar i.bad{background:var(--bad)}.m-bar i.no{background:var(--border)}
.m-step{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border)}
.m-gain{font-weight:700;color:var(--good);min-width:78px;white-space:nowrap}.m-gain small{font-weight:400;color:var(--muted)}
.lec-sub{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 8px 3px}
.lec-sub:first-child{padding-top:2px}
.lec-link .code{font-family:var(--mono);font-size:.72rem;color:var(--muted);min-width:34px}
.lec-link .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-bar{width:34px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;flex:none}
.mini-bar i{display:block;height:100%;background:var(--good)}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1}
.icon-btn:hover{background:var(--surface2)}
.menu-btn{display:none}
.hide-sm{display:inline}
main.wide{max-width:none}
.split{display:grid;grid-template-columns:minmax(0,var(--sl,1.25fr)) 14px minmax(0,var(--sr,1fr));gap:4px;align-items:start}
.split-handle{position:sticky;top:64px;height:calc(100vh - 150px);min-height:420px;cursor:col-resize;display:flex;justify-content:center;touch-action:none;border-radius:6px}
.split-handle::before{content:"";width:4px;height:100%;border-radius:2px;background:var(--border);transition:background .15s}
.split-handle:hover::before,.split-handle:focus-visible::before,body.resizing .split-handle::before{background:var(--accent)}
.split-handle:focus{outline:none}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .pdfframe,body.resizing .pdfjs{pointer-events:none}
.side-btn{display:inline-flex}
@media (min-width:901px){body.side-hidden .app{grid-template-columns:minmax(0,1fr)}body.side-hidden .sidebar{display:none}}
.pdfpane{position:sticky;top:64px}
.pdfjs{position:relative;height:calc(100vh - 150px);min-height:420px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;background:#525659;padding:8px 0;color:#fff}
.pdfjs .pg{position:relative;margin:0 auto 8px;width:calc(100% - 16px);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pdfjs canvas{display:block;width:100%;height:auto}
.pdfjs .pgno{position:absolute;right:6px;bottom:3px;font-size:11px;color:#94a3b8;z-index:4;pointer-events:none}
.pdfjs .textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.pdfjs .textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.pdfjs .textLayer span.markedContent{top:0;height:0}
.pdfjs .textLayer ::selection{background:rgba(37,99,235,.35)}
.pdfjs .pdflink{position:absolute;z-index:3;border-radius:2px}.pdfjs .pdflink:hover{background:rgba(37,99,235,.15);outline:1px solid rgba(37,99,235,.5)}
.pdfjs .pdfmsg{padding:16px;font-size:.9rem}
@media (max-width:1100px){.pdfjs{height:72vh;min-height:300px}}
.pdfframe{width:100%;height:calc(100vh - 150px);min-height:420px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.sidepane{max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr);gap:16px}.split-handle{display:none}.pdfpane{position:static}.sidepane{max-height:none}}
main{padding:24px;max-width:1040px;width:100%;margin:0 auto}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}

/* ---------- generic ui ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid.cols{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .05s}
.btn:hover{background:var(--surface2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar.good i{background:var(--good)}
.stat{display:flex;flex-direction:column}
.stat b{font-size:1.6rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.stepper{scroll-margin-top:68px;display:flex;align-items:center;gap:6px;margin:18px 0 20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted)}
.step:hover{text-decoration:none;background:var(--surface2)}
.step .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:.85rem;color:var(--muted)}
.step .lbl{display:flex;flex-direction:column;line-height:1.15;font-weight:600;font-size:.92rem;color:var(--text)}
.step .lbl small{font-weight:400;font-size:.72rem;color:var(--muted)}
.step.cur{border-color:var(--accent);background:var(--accent-soft)}
.step.cur .num{background:var(--accent);color:#fff}
.step.done .num{background:var(--good);color:#fff}
.stepper .sep{width:18px;height:2px;background:var(--border);flex:none}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;background:var(--border)}.dots i.on{background:var(--good)}
@media (max-width:700px){.stepper .sep{display:none}.step{flex:1 1 45%}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px 0;overflow-x:auto;scrollbar-width:none}
@media (max-width:600px){.tab{padding:10px 10px}}
.tab{padding:10px 16px;border:none;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text);text-decoration:none}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.as-q{padding:16px 18px;margin:12px 0}.as-q.kb{box-shadow:0 0 0 2px var(--accent)}.as-h{display:flex;gap:10px;align-items:center;margin-bottom:6px}.as-n{font-weight:800;color:var(--muted);min-width:22px}
.as-text{font-weight:600;margin-bottom:6px;line-height:1.5}.as-res{font-weight:700;font-size:.9rem}.as-res.ok{color:var(--good)}.as-res.bad{color:var(--bad)}
.as-expl{margin-top:10px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:8px}.as-expl .md p:first-child{margin-top:0}.as-expl .md p:last-child{margin-bottom:0}
.as-sum{display:flex;gap:12px;align-items:center;margin:10px 0 4px}.as-ans{margin-top:6px}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.hero .emoji{font-size:1.9rem;font-weight:800;color:var(--c,var(--accent));width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);flex:none}
.hero h1{font-size:1.7rem;margin:0}
.course-card{--c:var(--accent);cursor:pointer;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c);transition:transform .12s,box-shadow .12s;color:inherit}
.course-card:hover{transform:translateY(-2px);text-decoration:none}
.course-card h3{margin:0;font-size:1.12rem}
.course-card .emoji{font-size:1.5rem;font-weight:800;color:var(--c)}
.callout{border-left:4px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 7%,var(--surface));border-radius:0 12px 12px 0;padding:14px 18px}
.callout h3{margin-top:0;font-size:1rem}
.callout ul{margin:.3em 0 0;padding-left:1.1em}
.callout li{margin:.35em 0}
.dropdown{position:relative;display:inline-block}
.dd-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;display:none}
.dropdown.open .dd-menu{display:block}
.dd-menu button{width:100%;text-align:left;border:none;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;display:block}
.dd-menu button:hover{background:var(--surface2)}
.dd-menu small{display:block;color:var(--muted)}
.lec-row{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);color:inherit}
.lec-row:last-child{border-bottom:none}
.lec-row:hover{background:var(--surface2);text-decoration:none}
.lec-row .code{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:44px}
.lec-row .meta{font-size:.82rem;color:var(--muted)}
.list-card{padding:0;overflow:hidden}

/* ---------- markdown ---------- */
.md{max-width:78ch}
.md h2{font-size:1.25rem;margin-top:1.6em}
.md h3{font-size:1.08rem;margin-top:1.3em}
.md p{margin:.7em 0}
.md ul,.md ol{padding-left:1.35em;margin:.5em 0}
.md li{margin:.28em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--surface2);padding:.12em .38em;border-radius:6px;border:1px solid var(--border)}
.md pre{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow:auto}
.md pre code{background:none;border:none;padding:0}
.md table{border-collapse:collapse;margin:1em 0;display:block;overflow:auto;max-width:100%}
.md th,.md td{border:1px solid var(--border);padding:7px 12px;text-align:left}
.md th{background:var(--surface2)}
.md strong{font-weight:700}

/* ---------- flashcards ---------- */
.deck-wrap{max-width:760px;margin:0 auto}
.fcard{perspective:1400px;cursor:pointer;margin:18px 0}
.fcard-inner{position:relative;min-height:340px;transition:transform .45s;transform-style:preserve-3d}
.fcard.flipped .fcard-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);padding:28px 32px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c,var(--accent)) 6%,var(--surface))}
.face .lbl{position:absolute;top:14px;left:20px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.face .txt{font-size:1.28rem;line-height:1.5}
.face.back .txt{font-size:1.1rem}
.face .hint{position:absolute;bottom:12px;right:18px;font-size:.78rem;color:var(--muted)}
.rate{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.warnbtn{background:var(--warn);border-color:var(--warn);color:#fff}
.rate .btn{min-width:130px;justify-content:center;padding:12px 18px}
.kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface2);color:var(--muted)}
.leitner{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.leitner i{width:14px;height:6px;border-radius:3px;background:var(--border)}
.leitner i.on{background:var(--good)}

/* ---------- quiz ---------- */
.q-card{max-width:820px;margin:0 auto}
.q-text{font-size:1.14rem;margin:.4em 0 1em}
.q-text code{font-size:.9em}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;margin:8px 0;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .letter{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.82rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface2)}
.feedback.ok{border-color:var(--good);background:var(--good-soft)}
.feedback.no{border-color:var(--bad);background:var(--bad-soft)}
.feedback .why{margin-top:6px}
.answer-input{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface)}
textarea.answer-input{min-height:96px;font-family:var(--mono);font-size:.95rem;resize:vertical}
.qtype{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.prog-row{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.prog-row .bar{flex:1}
.q-grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.q-grid button{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.q-grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.q-grid button.cur{outline:2px solid var(--accent)}
.score-ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--border) 0);display:grid;place-items:center;flex:none}
.score-ring div{width:98px;height:98px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.7rem;font-weight:800}
.review-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0;background:var(--surface)}
.review-item.ok{border-left:5px solid var(--good)}
.review-item.no{border-left:5px solid var(--bad)}
.review-item.na{border-left:5px solid var(--warn)}

      let M; do { M = Array.from({ length: 5 }, () => Array.from({ length: 4 }, () => +(Math.random() < 0.45))); } while (M[0].map((_, c) => M.some(r => r[c])).includes(false));

    },
    sig(t) { return [0, 1].map(k => [0, 1, 2, 3].map(c => Math.min(...t.M.map((r, i) => r[c] ? (t.a[k] * i + t.b[k]) % 5 : 99)))); },
    view(t) {

        + ttab(['row', 'S1', 'S2', 'S3', 'S4'], t.M.map((r, i) => [i, ...r])) + `<p>Fill in the signature matrix (the smallest hash value over the rows where the set has a 1):</p>`
        + ttab(['', 'S1', 'S2', 'S3', 'S4'], [0, 1].map(k => [`h${k + 1}`, ...[0, 1, 2, 3].map(c => tin(`s${k}${c}`, 3))]));
    },
    answer(t) { const s = this.sig(t), o = {}; s.forEach((r, k) => r.forEach((v, c) => { o[`s${k}${c}`] = v; })); return o; },
    solution(t) {

      return ttab(['row', 'h1(row)', 'h2(row)', 'sets with a 1'], rows) + `<p>For each set take the smallest h1 and h2 value over its rows: ${this.sig(t).map((r, k) => `h${k + 1}: ${r.join(', ')}`).join(' · ')}.</p>`;
    }
  },
  dgim: {
    title: 'update the DGIM buckets',
    gen() { const c = { 1: rint(1, 2), 2: rint(1, 2), 4: rint(1, 2), 8: rint(0, 2) }; return { c }; },
    sizes(c) { return [1, 2, 4, 8, 16, 32].flatMap(s => Array(c[s] || 0).fill(s)); },
    after(t) { const c = Object.assign({}, t.c); c[1] = (c[1] || 0) + 1; const merges = []; for (let s = 1; s <= 16; s *= 2) if ((c[s] || 0) > 2) { c[s] -= 2; c[2 * s] = (c[2 * s] || 0) + 1; merges.push(s); } return { c, merges }; },
    view(t) {

    },
    answer(t) { const a = this.sizes(this.after(t).c); return { sizes: a, est: a.slice(0, -1).reduce((x, y) => x + y, 0) + a[a.length - 1] / 2 }; },
    solution(t) {

        <p>Result: ${a.join(', ')}. Estimate = all but the oldest + half the oldest = ${a.slice(0, -1).join(' + ')} + ${a[a.length - 1]}/2 = ${tf(this.answer(t).est)}.</p>`;

  bloom: {
    title: 'insert into and query a Bloom filter',
    gen() {
      const a = pick([3, 7]), b = rint(0, 9), S = [rint(10, 40), rint(41, 70)];
      const h = x => [x % 10, (a * x + b) % 10], bits = new Set(S.flatMap(h));
      let fp; for (let x = 11; x < 99 && fp === undefined; x++) if (!S.includes(x) && h(x).every(v => bits.has(v)) && Math.random() < 0.5) fp = x;
      const out = []; while (out.length < 2) { const x = rint(11, 98); if (!S.includes(x) && !out.includes(x) && x !== fp) out.push(x); }

    h(t, x) { return [x % 10, (t.a * x + t.b) % 10]; },
    bits(t) { return [...new Set(t.S.flatMap(x => this.h(t, x)))].sort((x, y) => x - y); },
    verdict(t, x) { const B = this.bits(t); return this.h(t, x).every(v => B.includes(v)) ? 'passes' : 'rejected'; },

        <p>Positions that are 1 after inserting: ${tin('bits', 14, 'e.g. 1, 4, 7')}</p>
        <p>Then query: ${t.Q.map((x, i) => `${x} -> ${tsel('q' + i, ['passes', 'rejected'])}`).join(' &nbsp; ')}</p>`;
    },
    answer(t) { const o = { bits: this.bits(t) }; t.Q.forEach((x, i) => { o['q' + i] = this.verdict(t, x); }); return o; },
    solution(t) {
      return `<p>${t.S.map(x => `${x}: h1 = ${this.h(t, x)[0]}, h2 = ${this.h(t, x)[1]}`).join('; ')} -> bits ${this.bits(t).join(', ')} are 1.</p><p>${t.Q.map(x => {
        const v = this.verdict(t, x); return `${x} -> bits ${this.h(t, x).join(' and ')}: ${v}${v === 'passes' && !t.S.includes(x) ? ' - a <b>false positive</b> (not in S)' : (t.S.includes(x) ? ' (a member always passes)' : '')}`; }).join('<br>')}</p>`;
    }
  },
  fm: {
    title: 'estimate distinct elements (Flajolet-Martin)',
    gen() { const L = shuffle(['a', 'b', 'c', 'd', 'e']).slice(0, 4), hv = {}; L.forEach(x => { hv[x] = rint(1, 31); }); const s = Array.from({ length: 6 }, (_, i) => i < 4 ? L[i] : pick(L)); return { s: shuffle(s), hv }; },

  ams: {

    est(t, p) { const e = t.s[p - 1], c = t.s.slice(p - 1).filter(x => x === e).length; return { e, c, v: t.s.length * (2 * c - 1) }; },

  girvan: {
    title: 'Girvan-Newman path counts and credits',
    gen() { const g = pick(TR_GRAPHS); return { g, root: pick(Object.keys(g.pos)) }; },
    run(t) {
      const adj = trAdj(t.g), lvl = { [t.root]: 0 }, order = [t.root];
      for (let i = 0; i < order.length; i++) adj[order[i]].forEach(v => { if (!(v in lvl)) { lvl[v] = lvl[order[i]] + 1; order.push(v); } });
      const p = { [t.root]: 1 }; order.slice(1).forEach(v => { p[v] = adj[v].filter(u => lvl[u] === lvl[v] - 1).reduce((s, u) => s + p[u], 0); });
      const cred = {}, ec = {}; order.forEach(v => { cred[v] = 1; });
      [...order].reverse().forEach(v => { const par = adj[v].filter(u => lvl[u] === lvl[v] - 1), tot = par.reduce((s, u) => s + p[u], 0); par.forEach(u => { const c = cred[v] * p[u] / tot; ec[u + v] = c; if (u !== t.root || true) cred[u] += c; }); });
      return { lvl, p, ec, kids: adj[t.root] };
    },
    view(t) {
      const R = this.run(t), nodes = Object.keys(t.g.pos).filter(n => n !== t.root);
      return `<div class="tr-row">${trGraph(t.g.pos, t.g.edges, false, { [t.root]: '#d97706' })}<div><p>Run a BFS from root <b>${t.root}</b> (orange).</p>
        <p>Number of shortest paths from ${t.root} to each node: ${nodes.map(n => `${n} ${tin('p' + n, 2)}`).join(' ')}</p>
        <p>Credit of each edge leaving the root: ${R.kids.map(k => `${t.root}-${k} ${tin('c' + k, 4)}`).join(' ')}</p></div></div>`;
    },
    answer(t) { const R = this.run(t), o = {}; Object.keys(t.g.pos).filter(n => n !== t.root).forEach(n => { o['p' + n] = R.p[n]; }); R.kids.forEach(k => { o['c' + k] = R.ec[t.root + k]; }); return o; },
    solution(t) {
      const R = this.run(t), byL = {}; Object.entries(R.lvl).forEach(([n, l]) => { (byL[l] = byL[l] || []).push(n); });
      return `<p>Levels: ${Object.keys(byL).map(l => byL[l].sort().join(', ')).join(' | ')}. Path counts (sum of the parents' counts): ${Object.keys(t.g.pos).map(n => `${n} ${R.p[n]}`).join(', ')}.</p>
        <p>Credits bottom-up: every node has 1 plus what it receives from below, split over its parents in proportion to their path counts. Edges at the root: ${R.kids.map(k => `${t.root}-${k} = ${tf(R.ec[t.root + k])}`).join(', ')} (they add up to ${Object.keys(t.g.pos).length - 1}, one unit for every other node).</p>`;
    }
  },
  conductance: {
    title: 'conductance of a cluster',
    gen() { const g = pick(TR_GRAPHS), n = Object.keys(g.pos).length; return { g, A: trBall(g, rint(2, n - 2)) }; },
    calc(t) { const adj = trAdj(t.g), m = t.g.edges.length, cut = t.g.edges.filter(([x, y]) => t.A.includes(x) !== t.A.includes(y)).length, vol = t.A.reduce((s, n) => s + adj[n].length, 0); return { m, cut, vol, phi: cut / Math.min(vol, 2 * m - vol) }; },

        <p>cut(A) ${tin('cut', 3)} &nbsp; vol(A) ${tin('vol', 3)} &nbsp; φ(A) = cut / min(vol, 2m - vol) ${tin('phi', 6)}</p></div></div>`;
    },
    answer(t) { const c = this.calc(t); return { cut: c.cut, vol: c.vol, phi: c.phi }; },

  modularity: {
    title: 'modularity of a two-group split',
    gen() { const g = pick(TR_GRAPHS), n = Object.keys(g.pos).length; return { g, A: trBall(g, rint(2, n - 2)) }; },

        <p>Inside edges L_A ${tin('LA', 3)} L_B ${tin('LB', 3)} &nbsp; degree sums d_A ${tin('dA', 3)} d_B ${tin('dB', 3)}</p><p>Q = Σ [L_s/m - (d_s/2m)²] ${tin('Q', 6)}</p></div></div>`;

  },
  allreduce: {
    title: 'one data-parallel SGD step',
    gen() { return { g: [0, 1, 2].map(() => [rint(-3, 4), rint(-3, 4)]), w: [pick([1, 0.5, 2]), pick([1, -0.5, 0])], eta: pick([0.1, 0.5]) }; },

        <p>All-reduce sum: ${tin('s', 10, 'x, y')} &nbsp; average: ${tin('a', 10, 'x, y')} &nbsp; new w on every worker: ${tin('w', 12, 'x, y')}</p>`;

  },
  las: {
    title: 'FIFO vs least attained service',
    gen() { const bA = 0, bB = rint(1, 2), bC = bB + rint(0, 1); return { arr: [bA, bB, bC], len: [rint(4, 7), rint(1, 3), rint(1, 2)] }; },
    run(t, las) {
      const n = 3, rem = t.len.slice(), att = [0, 0, 0], fin = [0, 0, 0], seq = [];
      if (!las) { let tm = 0; [0, 1, 2].forEach(i => { tm = Math.max(tm, t.arr[i]) + t.len[i]; fin[i] = tm; }); return { fin, seq: [] }; }
      for (let tm = 0; fin.some(f => !f) && tm < 50; tm++) {
        const ready = [0, 1, 2].filter(i => t.arr[i] <= tm && rem[i] > 0); if (!ready.length) { seq.push('-'); continue; }
        const j = ready.sort((a, b) => att[a] - att[b] || t.arr[a] - t.arr[b])[0]; seq.push('ABC'[j]); att[j]++; rem[j]--; if (!rem[j]) fin[j] = tm + 1;
      }
      return { fin, seq };
    },

function buildList(items) {

function parseCourseMeta(raw, dir) {
  const c = { id: dir, name: dir, emoji: '', color: '#2f6fed', tagline: '', exam: '' };
  const allowed = ['id', 'emoji', 'color', 'tagline', 'examq', 'exams', 'blueprint'];
  let sec = 'head', buf = [], gotName = false;
  String(raw).replace(/\r/g, '').split('\n').forEach(l => {
    if (!gotName && /^# /.test(l)) { c.name = l.slice(2).trim(); gotName = true; return; }
    if (/^##\s+/.test(l)) { sec = 'exam'; return; }
    if (sec === 'head') { const kv = /^(\w+):\s*(.*)$/.exec(l); if (kv && allowed.includes(kv[1])) c[kv[1]] = kv[2].trim(); }
    else buf.push(l);

}

/* ===== Exam plan: what to learn first =====
   Ranking uses (1) documented exam history: how many past exam questions were on the topic, (2) how much of the topic you have NOT
   mastered, (3) how many other topics build on it, (4) the time it takes to learn. Topics with no exam history get a small
   ESTIMATED share from their tier (my judgement), and are labelled as such. Mastery counts what you answered:
   "solid" = correct twice in a row (or a card at 3+ bars) and not overdue; "recent" = last answer correct, not yet confirmed. */
const planLecs = C => C.lectures.filter(L => L.plan && isLectureItem(L));

function lecMastery(L, now = Date.now()) {
  let stable = 0, short = 0, n = 0, tried = 0;
  L.questions.forEach(q => { n++; const x = qstat(q.id); if (x.last == null) return; tried++;
    if (x.last === 1 && (x.streak || 0) >= 2) stable += (x.due || 0) > now ? 1 : 0.6; else if (x.last === 1) short += 0.35; });
  L.cards.forEach(c => { n++; const x = cs(c.id); if (!x.n) return; tried++;
    if (x.b >= 3 && x.last === 1) stable += x.due > now ? 1 : 0.6; else if (x.last === 1) short += 0.35; });
  return { stable: n ? stable / n : 0, short: n ? short / n : 0, m: n ? (stable + short) / n : 0, tried, n, missed: L.questions.filter(q => qstat(q.id).last === 0).length };

function examPlan(C, now = Date.now()) {
  const rows = planLecs(C).map(L => ({ L, p: L.plan, ms: lecMastery(L, now) }));
  const byCode = new Map(rows.map(r => [(r.L.code || '').toLowerCase(), r]));
  const total = C.examq || rows.reduce((n, r) => n + (r.p.weight || 0), 0) || 1;
  rows.forEach(r => {
    const code = (r.L.code || '').toLowerCase();
    r.total = total;
    r.share = r.p.weight > 0 ? r.p.weight / total : ({ 2: 0.03, 3: 0.01 }[r.p.tier] || 0.01);
    r.dependents = rows.filter(x => (x.p.needs || []).some(c => c.toLowerCase() === code)).length;
    r.minutes = r.p.minutes || 30;
    r.unmet = (r.p.needs || []).map(c => byCode.get(c.toLowerCase())).filter(x => x && x.ms.m < 0.35);

const parseBlueprint = C => String((C && C.blueprint) || '').split(';').map(x => x.trim()).filter(Boolean).map(x => { const [label, codes] = x.split('='); return { label: label.trim(), codes: (codes || '').split('+').map(c => c.trim().toLowerCase()).filter(Boolean) }; });
const qModules = q => { const m = /Modules?\s+(L\d+(?:\s*(?:,|and|\+)\s*L\d+)*)/i.exec(q.expl || ''); return m ? (m[1].match(/L\d+/gi) || []).map(x => x.toLowerCase()) : [(q.lec.code || '').toLowerCase()]; };
const examGroupKey = q => { const m = /^Exam [A-Za-z]+ \d{4},? Q(\d+)/.exec(q.text); return m ? q.lec.id + '|' + m[1] : null; };
/* An exam paper: one multi-part question per documented exam theme (the course's "blueprint"), taken from past exams, those you
   have not answered or answered worst first. A theme with no past-exam question falls back to questions from its modules. */
function buildPaper(C, nq) {
  const bp = parseBlueprint(C).slice(0, nq), exQs = C.lectures.filter(L => /^EX\d/i.test(L.code || '')).flatMap(L => L.questions);
  const groups = new Map(); exQs.forEach(q => { const k = examGroupKey(q); if (!k) return; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(q); });
  const used = new Set(), questions = [], meta = {};
  bp.forEach((th, i) => {
    const cands = [...groups.entries()].filter(([k, qs]) => !used.has(k) && qs.some(q => qModules(q).some(c => th.codes.includes(c))));
    const rank = qs => qs.reduce((a, q) => { const x = qstat(q.id); return a + (x.last == null ? 0 : x.last === 1 ? 2 : 1); }, 0) / qs.length + Math.random();
    let parts;
    if (cands.length) { cands.sort((a, b) => rank(a[1]) - rank(b[1])); used.add(cands[0][0]); parts = cands[0][1]; }
    else parts = shuffle(C.lectures.filter(L => th.codes.includes((L.code || '').toLowerCase())).flatMap(L => L.questions).filter(q => ['calc', 'gen', 'short'].includes(q.type))).slice(0, 3);
    parts.forEach(q => { questions.push(q); meta[q.id] = { theme: th.label, no: i + 1 }; });
  });
  return { questions, meta, themes: bp.length };
}
function startPaper(cid, n) {
  const C = getCourse(cid); if (!C) return;
  const { questions, meta, themes } = buildPaper(C, n);
  if (!questions.length) { toast('No past-exam questions available for a paper'); return; }
  startQuiz(questions, 'Exam paper · ' + C.name, '#/exam', { mode: 'exam', minutes: themes >= 7 ? 180 : 90, meta, paper: true });
}

/* slide search: build.py ships each PDF page's text in L.slides.text */
function slideHits(L, q) {
  const tx = L.slides && L.slides.text; if (!tx || !q) return [];
  const out = [];
  tx.forEach((t, i) => {
    const low = t.toLowerCase(), j = low.indexOf(q); if (j < 0) return;
    let n = 0; for (let k = j; k >= 0; k = low.indexOf(q, k + q.length)) n++;
    const a = Math.max(0, j - 70);
    out.push({ p: i + 1, n, snip: (a ? '…' : '') + t.slice(a, j + q.length + 150) + (j + q.length + 150 < t.length ? '…' : '') });
  });
  return out;
}
function viewSearch(r) {
  const q = (r.arg || '').trim().toLowerCase();
  const input = $('#search'); if (input && document.activeElement !== input) input.value = r.arg || '';
  const hits = [], slides = [];
  if (q.length >= 2) {
    allLectures().forEach(L => {
      const link = `#/c/${L.course.id}/${L.slug}`;
      if (L.title.toLowerCase().includes(q)) hits.push({ k: 'Lecture', t: L.title, s: L.course.name, href: link + '/notes' });
      L.summary.split('\n').forEach(line => { if (line.toLowerCase().includes(q)) hits.push({ k: 'Notes · ' + L.title, t: line, href: link + '/notes' }); });
      L.cards.forEach(c => { if ((c.q + ' ' + c.a).toLowerCase().includes(q)) hits.push({ k: 'Flashcard · ' + L.title, t: c.q, s: c.a, href: link + '/cards' }); });
      L.questions.forEach(x => { if ((x.text + ' ' + x.answer + ' ' + x.expl).toLowerCase().includes(q)) hits.push({ k: 'Question · ' + L.title, t: x.text, href: link + '/quiz' }); });
      slideHits(L, q).forEach(h => slides.push({ k: 'Slides · ' + L.title + ' · slide ' + h.p, t: h.snip, href: link + '/study/' + h.p }));
    });
    hits.push(...slides);
  }
  const hl = s => { const t = String(s).slice(0, 260); const i = t.toLowerCase().indexOf(q); return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); };
  main.innerHTML = `<div class="crumbs"><a href="#/">Dashboard</a> › Search</div><h1>Search “${esc(r.arg || '')}”</h1>
    ${q.length < 2 ? '<div class="empty">Type at least 2 characters.</div>' : `<p class="muted">${hits.length} result${hits.length === 1 ? '' : 's'}${slides.length ? ` - ${slides.length} in the slides, listed last` : ''}${hits.length > 60 ? ' (showing 60)' : ''}</p><div class="card list-card">${hits.slice(0, 60).map(h => `<a class="result" href="${esc(h.href)}"><div class="k">${esc(h.k)}</div><div>${hl(h.t)}</div>${h.s ? `<div class="muted small">${hl(h.s)}</div>` : ''}</a>`).join('') || '<div class="empty">No matches.</div>'}</div>`}`;
}

function pickExam() {

  const sc = $('#ex-scope').value, source = $('#ex-source').value;
  UI.examSource = source; saveUI();

  let pool = (cid === 'all' ? COURSES : [getCourse(cid)]).flatMap(lecsOf).flatMap(L => L.questions);
  pool = filterQuestionSource(pool, source);
  if (types === 'auto') pool = pool.filter(q => ['mcq', 'multi', 'tf', 'calc', 'gen'].includes(q.type));
  if (types === 'written') pool = pool.filter(q => ['short', 'code'].includes(q.type));
  if (!pool.length) { toast(sc === 'mid' ? 'Mark the midterm lectures on the course page first' : 'No questions match those settings. Try another source, type or course.'); return; }
  let chosen;

    const score = q => { const s = qstat(q.id); return (s.last === 0 ? 0 : s.last === undefined || s.last === null ? 1 : 2) + Math.random(); };
    chosen = pool.slice().sort((a, b) => score(a) - score(b)).slice(0, n);
  } else chosen = shuffle(pool).slice(0, n);

}

const LS_SESSION = 'studyhub.session.v1';

      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status + (r.status === 404 || r.status === 501 ? ' - restart Start StudyHub to enable editing' : ''));
      close(); if (key !== '__explained') location.hash = xLink(L, L.course, key).replace(/&amp;/g, '&'); location.reload();
    } catch (e) { box.querySelector('#ned-status').textContent = 'Not saved: ' + e.message; btn.disabled = false; }
  };
}

/* ---------- boot ---------- */
if (P.theme) document.documentElement.dataset.theme = P.theme;
buildCourses();
if (migrateAliases()) { ls.set(LS_PROGRESS, P); ls.set(LS_USER, U); }
if (!location.hash) location.hash = '#/';
render();
syncNow(true);
setInterval(() => { if (SYNC.on && document.visibilityState === 'visible') syncNow(); }, 30000);
document.addEventListener('visibilitychange', () => { if (SYNC.on && document.visibilityState === 'visible') syncNow(); });
